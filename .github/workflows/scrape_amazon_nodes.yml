name: Amazon Node Scraper - Account 5 (24 nodes)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Max products per node
        required: false
        default: '99999'

jobs:
  scrape:
    name: "Node ${{ matrix.node_id }} (${{ matrix.node_name }})"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - { node_id: "21832868031", node_name: "Mobile Phones  Communication Produc" }
          - { node_id: "18022446031", node_name: "node_18022446031" }
          - { node_id: "18022275031", node_name: "Calendars, Planners & Personal Organizer" }
          - { node_id: "18017807031", node_name: "node_18017807031" }
          - { node_id: "21845324031", node_name: "node_21845324031" }
          - { node_id: "21858032031", node_name: "node_21858032031" }
          - { node_id: "21826030031", node_name: "node_21826030031" }
          - { node_id: "21845327031", node_name: "node_21845327031" }
          - { node_id: "27972173031", node_name: "node_27972173031" }
          - { node_id: "21832887031", node_name: "node_21832887031" }
          - { node_id: "21832870031", node_name: "node_21832870031" }
          - { node_id: "21845331031", node_name: "node_21845331031" }
          - { node_id: "27360698031", node_name: "node_27360698031" }
          - { node_id: "21858001031", node_name: "node_21858001031" }
          - { node_id: "21820640031", node_name: "node_21820640031" }
          - { node_id: "21857922031", node_name: "node_21857922031" }
          - { node_id: "26082322031", node_name: "node_26082322031" }
          - { node_id: "21833214031", node_name: "node_21833214031" }
          - { node_id: "21832909031", node_name: "node_21832909031" }
          - { node_id: "21832915031", node_name: "node_21832915031" }
          - { node_id: "27322895031", node_name: "node_27322895031" }
          - { node_id: "21833215031", node_name: "node_21833215031" }
          - { node_id: "18021933031", node_name: "node_18021933031" }
          - { node_id: "90278688031", node_name: "node_90278688031" }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install curl-cffi scrapy
      - name: Stagger start
        run: sleep $((RANDOM % 20 + 5))
      - name: Scrape node ${{ matrix.node_id }}
        run: python amazon_node_spider.py --node_id ${{ matrix.node_id }} --node_name "${{ matrix.node_name }}" --limit ${{ github.event.inputs.limit || '99999' }}
        timeout-minutes: 90
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.node_id }}
          path: node_*.json
          if-no-files-found: warn

  export:
    name: Merge and Export CSV
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: node-*
          merge-multiple: true
      - name: Merge JSON to CSV
        run: python merge_nodes.py
      - name: Upload merged CSV
        uses: actions/upload-artifact@v4
        with:
          name: amazon-products-nodes
          path: amazon_products_nodes.csv
      - name: Push to master repo
        if: always()
        env:
          MASTER_TOKEN: ${{ secrets.MASTER_REPO_TOKEN }}
          MASTER_OWNER: ${{ secrets.MASTER_REPO_OWNER }}
        run: |
          if [ -z "$MASTER_TOKEN" ]; then echo "No token"; exit 0; fi
          git clone https://${MASTER_TOKEN}@github.com/${MASTER_OWNER}/scraped-products-master.git master_repo
          mkdir -p master_repo/data/account5/
          cp amazon_products_nodes.csv master_repo/data/account5/amazon_products_nodes.csv
          cd master_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update nodes from account5 - $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && echo "OK" && break || sleep 10
          done
